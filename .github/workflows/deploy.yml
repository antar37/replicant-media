name: Deploy Replicant Media

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-replicant-media
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_KEY: ${{ secrets.TELEGRAM_BOT_KEY }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare API token is configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN GitHub secret is required for deployment." >&2
            exit 1
          fi

      - name: Build static Worker assets
        run: pnpm run build:worker

      - name: Deploy Worker
        run: pnpm exec wrangler deploy

      - name: Sync Worker secrets
        if: ${{ secrets.TELEGRAM_BOT_KEY != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        run: |
          cat > .worker-secrets.env <<'EOF'
          TELEGRAM_BOT_KEY=${{ secrets.TELEGRAM_BOT_KEY }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          EOF
          pnpm exec wrangler secret bulk .worker-secrets.env --name replicant-media
          rm -f .worker-secrets.env

      - name: Smoke test production domain
        run: |
          curl -fsS --retry 6 --retry-delay 10 https://replicant.media/ >/tmp/replicant.html
          grep -q "Replicant Media" /tmp/replicant.html
