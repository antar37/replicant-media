name: Deploy Replicant Media

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-replicant-media
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      JOTFORM_FORM_ID: ${{ secrets.JOTFORM_FORM_ID }}
      JOTFORM_FIELD_NAME: ${{ secrets.JOTFORM_FIELD_NAME }}
      JOTFORM_FIELD_EMAIL: ${{ secrets.JOTFORM_FIELD_EMAIL }}
      JOTFORM_FIELD_COMPANY: ${{ secrets.JOTFORM_FIELD_COMPANY }}
      JOTFORM_FIELD_WEBSITE: ${{ secrets.JOTFORM_FIELD_WEBSITE }}
      JOTFORM_FIELD_SERVICES: ${{ secrets.JOTFORM_FIELD_SERVICES }}
      JOTFORM_FIELD_BUDGET: ${{ secrets.JOTFORM_FIELD_BUDGET }}
      JOTFORM_FIELD_TIMELINE: ${{ secrets.JOTFORM_FIELD_TIMELINE }}
      JOTFORM_FIELD_PROJECT_BRIEF: ${{ secrets.JOTFORM_FIELD_PROJECT_BRIEF }}
      JOTFORM_FIELD_BEST_NEXT_STEP: ${{ secrets.JOTFORM_FIELD_BEST_NEXT_STEP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run regression tests
        run: node --test tests/*.test.mjs

      - name: Verify Cloudflare API token is configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN GitHub secret is required for deployment." >&2
            exit 1
          fi

      - name: Build static Worker assets
        run: pnpm run build:worker

      - name: Deploy Worker
        run: pnpm exec wrangler deploy

      - name: Sync Jotform Worker settings
        if: ${{ env.JOTFORM_FORM_ID != '' }}
        run: |
          set -eu
          : > .worker-secrets.env
          for key in \
            JOTFORM_FORM_ID \
            JOTFORM_FIELD_NAME \
            JOTFORM_FIELD_EMAIL \
            JOTFORM_FIELD_COMPANY \
            JOTFORM_FIELD_WEBSITE \
            JOTFORM_FIELD_SERVICES \
            JOTFORM_FIELD_BUDGET \
            JOTFORM_FIELD_TIMELINE \
            JOTFORM_FIELD_PROJECT_BRIEF \
            JOTFORM_FIELD_BEST_NEXT_STEP
          do
            value="$(printenv "$key" || true)"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$key" "$value" >> .worker-secrets.env
            fi
          done
          pnpm exec wrangler secret bulk .worker-secrets.env --name replicant-media
          rm -f .worker-secrets.env

      - name: Smoke test production domain
        run: |
          set -eu
          curl -fsS --retry 6 --retry-delay 10 https://replicant.media/ -o replicant-smoke.html
          grep -q "Replicant Media" replicant-smoke.html
          rm replicant-smoke.html
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://replicant.media/seo)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://replicant.media/seo-audit-not-found)" = 404
          test "$(curl -sS -o /dev/null -w '%{redirect_url}' https://www.replicant.media/seo)" = https://replicant.media/seo
